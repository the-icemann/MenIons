name: menions-v2

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: menions
      POSTGRES_PASSWORD: menions
      POSTGRES_DB: menions
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menions -d menions"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://menions:menions@db:5432/menions
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - .:/srv
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Payment status checks, EFRIS retries and alerts, the daily check and data clean-up.
  worker:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://menions:menions@db:5432/menions
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/srv
    command: python -m app.worker
    restart: unless-stopped

volumes:
  pgdata:
