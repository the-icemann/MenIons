[project]
name = "men-ions"
version = "0.1.0"
description = "Men-Ions: WhatsApp-first boda delivery backend"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends(...) defaults

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"alembic/versions/*" = ["E501"]
"app/bots/*" = ["E501"]  # user-facing message text reads better unwrapped
